<!DOCTYPE html>
<html lang="en">
<head>

<title>You're offline | Hanif Printing</title>
<style>

    color: #f5f7fa;
    font-family: system-ui, -apple-system, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
  }
  img {
    width: 64px;

    <img src="/icons/icon-192.png" alt="Hanif Printing" />
